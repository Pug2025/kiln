<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kiln Render Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #07080A; overflow: hidden; color: #F2F4F7; font-family: Inter, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  .kiln-canvas { display: block; width: 100%; height: 100%; transition: filter .18s cubic-bezier(.2,.7,.2,1); }
  #bar { position: fixed; right: 12px; top: 12px; z-index: 60; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; }
  #bar button { height: 28px; padding: 0 10px; border-radius: 4px; border: 0; background: rgba(255,255,255,.1); color: #F2F4F7; font: 500 12px Inter, sans-serif; cursor: pointer; }
  #bar button:hover { background: rgba(255,255,255,.16); }
  #rect { position: fixed; border-top: 1px solid rgba(95,212,230,.8); pointer-events: none; z-index: 55; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="rect"></div>
<div id="bar"></div>
<script type="module" src="./gallery.js"></script>
</body>
</html>
